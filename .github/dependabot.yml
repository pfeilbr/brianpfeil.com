# Keeps the GitHub Actions used by the workflows on current versions
# (checkout, setup-*, upload/deploy-pages, cache...), and the two places that
# pull third-party code: the Go post generator's modules and the Python
# tools' requirements. The Hugo version is a workflow input, not an action
# version, so it stays pinned by hand. Monthly and grouped: one PR each.
# The two third-party actions (peaceiris/actions-hugo, hashicorp/setup-terraform)
# are pinned to a commit SHA with the tag in a comment; Dependabot bumps both.
# cooldown: a release is only proposed once it is a week old, so a hijacked
# package that is caught and yanked within days never reaches a PR here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /tools/generate-posts
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /tools/ai-radar
      - /tools/instagram-media
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
