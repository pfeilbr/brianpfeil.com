name: Tests

# The deploy workflow only builds the site, so until now nothing ran the tests
# for either tool. Both are pure unit tests: no AWS, no GitHub API, no network.
on:
  push:
    branches: [main]
  pull_request:

# Read-only: nothing here writes to the repo, issues or packages. The
# checkouts also drop the token (persist-credentials: false), since no step
# pushes.
permissions:
  contents: read

# A newer push to the same PR makes the older run moot; cancel it. Runs on
# main are never cancelled, so every commit there keeps its own result.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  post-generator:
    name: generate-posts (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/generate-posts/go.mod
          cache-dependency-path: tools/generate-posts/go.sum
      # vet catches the mistakes tests miss (bad Printf verbs, copied locks).
      - run: go vet ./...
        working-directory: tools/generate-posts
      - run: go test ./...
        working-directory: tools/generate-posts
      # The downloaded modules match go.sum.
      - run: go mod verify
        working-directory: tools/generate-posts

  go-vulns:
    name: generate-posts (govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Current stable Go, not go.mod's exact 1.26.0: the generator is run on
      # a laptop with an up-to-date Go, and 1.26.0's own standard-library
      # bugs (fixed in its patch releases) say nothing about the code here.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: tools/generate-posts/go.sum
      # Fails only on a known vulnerability in code the generator actually
      # calls. govulncheck itself is pinned; bump it on purpose.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: tools/generate-posts

  media-tool:
    name: instagram-media (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/instagram-media/requirements.txt
      # ffmpeg so the video tests run rather than skip: they are what proves
      # a published clip carries no location or creation time.
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements.txt
        working-directory: tools/instagram-media
      - run: python -m unittest discover -s tests -v
        working-directory: tools/instagram-media
      # Unit tests only; the live link check needs the network and is run by
      # hand with `make check-repo-links`.
      - name: link-check tests
        run: python -m unittest discover -s tools/link-check -p 'test_*.py' -v
      - name: github-repos tests
        run: python -m unittest discover -s tools/github-repos -p 'test_*.py' -v
      - name: GitHub page search tests (node)
        run: node --test tools/github-repos/search.test.mjs
      - name: ai-radar tests
        run: |
          python -m unittest discover -s tools/ai-radar/tests -v
          python tools/ai-radar/i18n_strings.py --check
      - name: i18n-check tests
        run: python -m unittest discover -s tools/i18n-check -p 'test_*.py' -v
      - name: learn-links tests and offline data check
        run: |
          python -m unittest discover -s tools/learn-links -p 'test_*.py' -v
          python tools/learn-links/check_learn_links.py --offline
          python tools/learn-links/path_pages.py --check
      # Includes a privacy check of every published lesson page.
      - name: course sync tests
        run: python -m unittest discover -s tools/courses -p 'test_*.py' -v
      - name: IndexNow tests
        run: python -m unittest discover -s tools/indexnow -p 'test_*.py' -v
      - name: site-check tests
        run: python -m unittest discover -s tools/site-check -p 'test_*.py' -v
      - name: Social profiles check tests
        run: python -m unittest discover -s tools/profiles -p 'test_*.py' -v
      - name: Subscriptions refresher tests
        run: python -m unittest discover -s tools/subscriptions -p 'test_*.py' -v
      - name: image-rescue tests
        run: python -m unittest discover -s tools/image-rescue -p 'test_*.py' -v
      - name: social kit tests
        run: python -m unittest discover -s tools/social/tests -v
      - name: movies payload check tests
        run: python -m unittest discover -s tools/movies -p 'test_*.py' -v
      - name: apps check tests
        run: python -m unittest discover -s tools/apps -p 'test_*.py' -v
      # These four ran only in `make verify` (or nowhere): stdlib-only unit
      # tests, so CI can run them as-is.
      - name: music refresher tests
        run: python -m unittest discover -s tools/music -p 'test_*.py' -v
      - name: newsletter tests (issues and the sent ledger)
        run: python -m unittest discover -s tools/newsletter -p 'test_*.py' -v
      - name: Instagram carousel tests
        run: python -m unittest discover -s tools/ig-carousel -p 'test_*.py' -v
      - name: Drafts extractor tests
        run: python -m unittest discover -s tools/drafts-extract -p 'test_*.py' -v
      - name: docs check (every Makefile target documented)
        run: |
          python -m unittest discover -s tools/docs-check -p 'test_*.py' -v
          python tools/docs-check/check_docs.py

  python-vulns:
    name: Python requirements (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The only pinned third-party Python packages (every other tool is
      # standard library only). pip-audit is pinned; bump it on purpose.
      - run: pip install -q pip-audit==2.10.1
      - run: pip-audit --progress-spinner off -r tools/ai-radar/requirements.txt -r tools/instagram-media/requirements.txt

  site:
    name: hugo build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          # Same pin as the deploy workflow; bump them together.
          hugo-version: "0.166.0"
          extended: true
      # The share cards the deploy already drew (see gh-pages.yml); read-only
      # here, so a PR can never put anything in the deploy's cache.
      - name: Restore Hugo's generated images
        uses: actions/cache/restore@v6
        with:
          path: resources/_gen
          key: hugo-resources-none
          restore-keys: hugo-resources-
      - name: Build with warnings surfaced
        run: hugo --minify --printI18nWarnings --printPathWarnings
      # Hugo falls back to English silently; this checks the i18n files agree
      # and that no translated page is showing English it has a translation for.
      - name: i18n consistency and fallback check
        run: python3 tools/i18n-check/check_i18n.py --public public
      # Builds /media/ from a fixture and with no data, then checks
      # /data/media.json (whitelisted, no coordinates) and the page shell in
      # all nine languages.
      - name: GitHub page render check
        run: python3 tools/github-repos/check_page.py --public public
      # Every same-site link resolves; no tag/category casing clashes.
      - name: Internal link check
        run: python3 tools/site-check/check_site.py --public public
      # Six nav links, the home page's calls to action, articles vs lab notes
      # in every language, project redirects, no links to gone repos.
      - name: Site structure check
        run: python3 tools/site-check/check_structure.py --public public
      # /movies/ loads /data/movies.<lang>.json; it must match movies.json.
      - name: Movies per-language payload check
        run: python3 tools/movies/check_payload.py --public public
      # /apps/ in every language, and a redirect at /apps/<key>/ for each app.
      - name: Apps page and short links check
        run: python3 tools/apps/check_page.py --public public
      # Every social profile on /about/, the home hero, sameAs and the footer.
      - name: Social profiles check
        run: python3 tools/profiles/check_profiles.py --public public
      - name: Media page render check
        run: python3 tools/instagram-media/tests/check_layout.py --build
      # Builds /ai/ from a fixture briefing and with no data; checks the page
      # shell, meta description, briefing feed and home card in every language.
      - name: AI radar page render check
        run: python3 tools/ai-radar/check_page.py --build

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.3"
      - name: fmt
        run: terraform fmt -check -recursive
        working-directory: infra
      # -backend=false: validation needs the provider schema, not the state,
      # so this runs with no AWS credentials at all.
      - name: validate site stack
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra
      - name: validate bootstrap stack
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra/bootstrap
