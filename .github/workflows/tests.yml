name: Tests

# The deploy workflow only builds the site, so until now nothing ran the tests
# for either tool. Both are pure unit tests: no AWS, no GitHub API, no network.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  post-generator:
    name: generate-posts (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/generate-posts/go.mod
          cache-dependency-path: tools/generate-posts/go.sum
      - run: go test ./...
        working-directory: tools/generate-posts

  media-tool:
    name: instagram-media (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/instagram-media/requirements.txt
      # ffmpeg so the video tests run rather than skip: they are what proves
      # a published clip carries no location or creation time.
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements.txt
        working-directory: tools/instagram-media
      - run: python -m unittest discover -s tests -v
        working-directory: tools/instagram-media
      # Unit tests only; the live link check needs the network and is run by
      # hand with `make check-repo-links`.
      - name: link-check tests
        run: python -m unittest discover -s tools/link-check -p 'test_*.py' -v
      - name: i18n-check tests
        run: python -m unittest discover -s tools/i18n-check -p 'test_*.py' -v
      - name: docs check (every Makefile target documented)
        run: |
          python -m unittest discover -s tools/docs-check -p 'test_*.py' -v
          python tools/docs-check/check_docs.py

  site:
    name: hugo build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          # Same pin as the deploy workflow; bump them together.
          hugo-version: "0.166.0"
          extended: true
      - name: Build with warnings surfaced
        run: hugo --minify --printI18nWarnings --printPathWarnings
      # Hugo falls back to English silently; this checks the i18n files agree
      # and that no translated page is showing English it has a translation for.
      - name: i18n consistency and fallback check
        run: python3 tools/i18n-check/check_i18n.py --public public
      # Builds /media/ from a fixture and with no data, then checks
      # /data/media.json (whitelisted, no coordinates) and the page shell in
      # all nine languages.
      - name: Media page render check
        run: python3 tools/instagram-media/tests/check_layout.py --build

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"
      - name: fmt
        run: terraform fmt -check -recursive
        working-directory: infra
      # -backend=false: validation needs the provider schema, not the state,
      # so this runs with no AWS credentials at all.
      - name: validate site stack
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra
      - name: validate bootstrap stack
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra/bootstrap
