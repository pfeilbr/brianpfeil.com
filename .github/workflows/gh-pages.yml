name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # The daily AI radar (ai-radar.yml) commits with GITHUB_TOKEN, and pushes
  # made with that token never trigger other workflows, so it dispatches
  # this one explicitly.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned: "latest" picked up 0.166.0 unannounced and broke the deploy.
          # Bump deliberately after a local build passes on the new version.
          hugo-version: "0.166.0"
          extended: true

      - name: Build
        run: hugo --minify

      # The manifest of the last batch IndexNow actually accepted. Saved by
      # the indexnow job only on success, so a refused batch is retried.
      - name: Restore last IndexNow submission
        uses: actions/cache/restore@v4
        with:
          path: .indexnow/manifest.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-

      # Writes public/indexnow-manifest.json (ships with the site) and lists
      # the pages that changed since the last accepted submission. Never
      # blocks a deploy.
      - name: Plan IndexNow submission
        run: |
          # No cached record of an accepted submission = submit everything.
          python3 tools/indexnow/indexnow.py plan public --out changed-urls.txt \
            --previous-file .indexnow/manifest.json --previous none || true
          cp public/indexnow-manifest.json new-manifest.json || true

      - name: Keep the changed-URL list for after the deploy
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-changed
          path: |
            changed-urls.txt
            new-manifest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing and the other IndexNow engines what just changed, once the new
  # pages are actually live (they fetch the key file to verify us).
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/indexnow

      - name: Fetch the changed-URL list
        uses: actions/download-artifact@v4
        with:
          name: indexnow-changed
        continue-on-error: true

      - name: Submit to IndexNow
        id: submit
        run: |
          if [ ! -f changed-urls.txt ]; then echo "no changed-URL list; skipping"; exit 0; fi
          status=0
          python3 tools/indexnow/indexnow.py submit changed-urls.txt || status=$?
          if [ "$status" = 0 ]; then echo "accepted=1" >> "$GITHUB_OUTPUT"; fi
          # 3 = come back later (key not verified yet, rate limited): keep the
          # deploy green and retry these URLs next time.
          if [ "$status" = 3 ]; then status=0; fi
          exit $status

      - name: Record the accepted manifest
        if: steps.submit.outputs.accepted == '1'
        run: mkdir -p .indexnow && cp new-manifest.json .indexnow/manifest.json

      - name: Save it for the next deploy
        if: steps.submit.outputs.accepted == '1'
        uses: actions/cache/save@v4
        with:
          path: .indexnow/manifest.json
          key: indexnow-${{ github.run_id }}
