name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # The daily AI radar (ai-radar.yml) commits with GITHUB_TOKEN, and pushes
  # made with that token never trigger other workflows, so it dispatches
  # this one explicitly.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned: "latest" picked up 0.166.0 unannounced and broke the deploy.
          # Bump deliberately after a local build passes on the new version.
          hugo-version: "0.166.0"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
