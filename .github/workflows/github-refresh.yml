name: GitHub refresh

# Rewrites data/github.json (the /github/ page) every Monday and deploys it.
# The refresher reads only public repos, which GITHUB_TOKEN can see, and it
# leaves the file alone when nothing but the date would change, so a quiet
# week makes no commit. It refuses to write if more than 10% of repos vanish
# (a partial API answer), and the run then fails instead of emptying the page.
on:
  schedule:
    - cron: "43 9 * * 1"   # Mondays 09:43 UTC, off the top of the hour
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: github-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tests
        run: |
          python -m unittest discover -s tools/github-repos -p 'test_*.py'
          node --test tools/github-repos/search.test.mjs
      - name: Fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/github-repos/refresh.py
      - name: Check the refreshed file
        run: python -m unittest discover -s tools/github-repos -p 'test_*.py'
      # The same test the commit step makes (the refresher leaves the file
      # alone when only the date would change). Nothing new = no commit, so
      # the build that only guards a commit is skipped too.
      - name: Anything new?
        id: diff
        run: |
          if git diff --quiet -- data/github.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "nothing new; skipping the build"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # The page must still build and render in all nine languages with the
      # new data before anything is pushed. Same Hugo pin as the deploy.
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        if: steps.diff.outputs.changed == 'true'
        with:
          hugo-version: "0.166.0"
          extended: true
      # The share cards the deploy already drew (gh-pages.yml), read-only:
      # without it this build redraws ~100 MB of images just to check the
      # page, and a scheduled run never writes the deploy's cache.
      - name: Restore Hugo's generated images
        if: steps.diff.outputs.changed == 'true'
        uses: actions/cache/restore@v6
        with:
          path: resources/_gen
          key: hugo-resources-none
          restore-keys: hugo-resources-
      - name: Build and render check
        if: steps.diff.outputs.changed == 'true'
        run: |
          hugo --minify
          python tools/github-repos/check_page.py --public public
      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "GitHub refresh: $(date -u +%Y-%m-%d)"
          # data/github.json is only written here, so a rebase never conflicts on it.
          # Three tries; if none lands, fail rather than report a change
          # (and dispatch a deploy) that never reached main.
          pushed=false
          for _ in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then pushed=true; break; fi
            sleep 5
          done
          if [ "$pushed" != true ]; then echo "::error::push to main failed 3 times"; exit 1; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Pushes made with GITHUB_TOKEN never trigger other workflows, so the
      # deploy is dispatched explicitly (gh-pages.yml has workflow_dispatch).
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gh-pages.yml --ref main
