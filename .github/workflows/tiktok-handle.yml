name: TikTok handle

# B renamed their TikTok from the generated user8768514322831 to @pfeilbr on
# 2026-10-07 and the site links @pfeilbr. Every Monday this checks that
# @pfeilbr is still that account (same user id) and fails if not. While the
# site still linked the old handle, it switched the links itself once
# @pfeilbr resolved to the account; that path is kept for the record.
on:
  schedule:
    - cron: "41 9 * * 1"   # Mondays 09:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tiktok-handle
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tests
        run: python -m unittest discover -s tools/profiles -p 'test_*.py'
      - name: Check and switch
        run: python tools/profiles/tiktok_handle.py --apply
      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A config.yaml data/home.yaml content tools/profiles
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "TikTok: link @pfeilbr now that the username is changed"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Pushes made with GITHUB_TOKEN never trigger other workflows, so the
      # deploy is dispatched explicitly (gh-pages.yml has workflow_dispatch).
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gh-pages.yml --ref main
