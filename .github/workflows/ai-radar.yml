name: AI radar

# Rewrites data/ai.json (the /ai/ page) twice a day and deploys it. The
# morning run also writes the day's briefing (digest.py, one Claude call)
# when the ANTHROPIC_API_KEY secret is set; without it the page simply has
# no briefing. A source that fails keeps yesterday's entries; the run only
# fails if the result does not match tools/ai-radar/schema.json, in which
# case nothing is committed. Sources failing 3+ runs in a row keep one
# issue open ("AI radar: sources failing") until they recover.
on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC: early morning US Eastern, off the top of the hour
    - cron: "17 22 * * *"   # evening refresh; the briefing is written once a day
  workflow_dispatch:
    inputs:
      only:
        description: "Source ids to fetch (space-separated); empty = all"
        required: false
        default: ""

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: ai-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/ai-radar/requirements.txt
      - run: pip install -q -r tools/ai-radar/requirements.txt
      - name: Tests
        run: python -m unittest discover -s tools/ai-radar/tests
      - name: Fetch
        env:
          ONLY: ${{ inputs.only }}
        run: python tools/ai-radar/radar.py ${ONLY:+--only $ONLY}
      - name: Briefing
        # Once a day (digest.py skips if today's exists); a no-op without the key.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/ai-radar/digest.py
      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai.json data/ai-digests.json 2>/dev/null || git add data/ai.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "AI radar: $(date -u +%Y-%m-%d)"
          # Someone may have pushed while this ran; data/ai.json is only
          # written here, so a rebase never conflicts on it.
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Source health issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(python tools/ai-radar/health.py)"
          title="AI radar: sources failing"
          num="$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')"
          if [ -n "$body" ]; then
            if [ -n "$num" ]; then gh issue edit "$num" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Every source is healthy again."
          fi
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gh-pages.yml --ref main
