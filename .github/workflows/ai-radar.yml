name: AI radar

# Rewrites data/ai.json (the /ai/ page) every morning and deploys it.
# The fetcher is standard-library Python, so there is no install step.
# A source that fails keeps yesterday's entries; the run only fails if the
# result does not match tools/ai-radar/schema.json, in which case nothing
# is committed.
on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC: early morning US Eastern, off the top of the hour
  workflow_dispatch:
    inputs:
      only:
        description: "Source ids to fetch (space-separated); empty = all"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests
        run: python -m unittest discover -s tools/ai-radar/tests
      - name: Fetch
        env:
          ONLY: ${{ inputs.only }}
        run: python tools/ai-radar/radar.py ${ONLY:+--only $ONLY}
      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "AI radar: $(date -u +%Y-%m-%d)"
          # Someone may have pushed while this ran; data/ai.json is only
          # written here, so a rebase never conflicts on it.
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gh-pages.yml --ref main
