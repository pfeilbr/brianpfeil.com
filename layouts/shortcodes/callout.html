{{- /* A highlighted aside in long-form content.
   {{< callout "key" >}}…{{< /callout >}} for an insight, "warn" for a caveat.
   The body is Markdown. */ -}}
{{- $kind := .Get 0 | default "key" -}}
<div class="callout callout-{{ $kind }}" role="note">{{ .Inner | .Page.RenderString (dict "display" "block") }}</div>
