{{- /* A tinted square holding one glyph. Decorative: every row already shows
   its title and tags in text, so this is hidden from assistive tech and the
   title attribute is a hover affordance for sighted readers only. */ -}}
{{- $id := .id -}}
{{- $size := .size | default "sm" -}}
<span class="ic ic-{{ $size }}" data-ic="{{ $id }}" aria-hidden="true"{{ with .label }} title="{{ . }}"{{ end }}>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#{{ $id }}"/></svg>
</span>
