baseURL: "https://brianpfeil.com/"
disablePathToLower: true
enableRobotsTXT: true
languageCode: "en-us"
title: "Brian Pfeil"

buildFuture: true
pagination:
  pagerSize: 30

googleAnalytics: "G-SKVHNJ985Y"

# Hugo 0.162.0 added security.allowContent, which denies the text/html content
# format by default to prevent arbitrary JS in content files. content/steps/*.html
# are hand-authored standalone HTML pages, so the default breaks the build.
# Single-author repo, so restore the pre-0.162 behavior.
security:
  allowContent:
    - ".*"

related:
  includeNewer: true
  threshold: 30
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 40
    - name: date
      weight: 10

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: trac
    lineNos: false
    noClasses: false

params:
  homeTitle: "Brian Pfeil"
  mainSections: ["post", "posts"]
  dateFormat: "January 2, 2006"
  rss: true
  rssLimit: 500
  author:
    name: "Brian Pfeil"
    website: "https://brianpfeil.com"
    github: "pfeilbr"
    twitter: "pfeilbr"
    stackoverflow: "users/29148/pfeilbr"

mediaTypes:
  text/plain:
    suffixes:
      - txt

outputFormats:
  llmstxt:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - html
    - rss
    - json
    - llmstxt

menus:
  main:
    - name: "about"
      url: "/about/"
      weight: 10
    - name: "posts"
      url: "/"
      weight: 20
    - name: "projects"
      url: "/projects/"
      weight: 30
    - name: "tags"
      url: "/tags/"
      weight: 40
