baseURL: "https://brianpfeil.com/"
disablePathToLower: true
enableRobotsTXT: true
title: "Brian Pfeil"

# Multilingual. English is the source language and stays at the site root so
# every existing URL is unchanged; Mandarin lives under /zh/. Posts are written
# in English only -- the zh site translates the chrome and the standalone pages
# and lists the English posts (see partials/site-posts.html).
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

buildFuture: true
pagination:
  pagerSize: 30

googleAnalytics: "G-SKVHNJ985Y"

# Hugo 0.162.0 added security.allowContent, which denies the text/html content
# format by default to prevent arbitrary JS in content files. content/steps/*.html
# are hand-authored standalone HTML pages, so the default breaks the build.
# Single-author repo, so restore the pre-0.162 behavior.
security:
  allowContent:
    - ".*"

related:
  includeNewer: true
  threshold: 30
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 40
    - name: date
      weight: 10

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false
  highlight:
    style: trac
    lineNos: false
    noClasses: false

params:
  homeTitle: "Brian Pfeil"
  mainSections: ["post", "posts"]
  dateFormat: "January 2, 2006"
  rss: true
  rssLimit: 500
  author:
    name: "Brian Pfeil"
    website: "https://brianpfeil.com"
    github: "pfeilbr"
    twitter: "pfeilbr"
    stackoverflow: "users/29148/pfeilbr"
    # Handle only. A Discord profile URL needs the numeric user id, not the
    # @handle, so the footer offers this to copy rather than linking to it.
    discord: "pfeilbr"

mediaTypes:
  text/plain:
    suffixes:
      - txt

outputFormats:
  llmstxt:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - html
    - rss
    - json
    - llmstxt

languages:
  en:
    locale: "en-us"
    label: "English"
    weight: 1
    title: "Brian Pfeil"
    params:
      homeTitle: "Brian Pfeil"
    menus:
      main:
        - name: "about"
          url: "/about/"
          weight: 10
        - name: "posts"
          url: "/"
          weight: 20
        - name: "projects"
          url: "/projects/"
          weight: 30
        - name: "music"
          url: "/music/"
          weight: 35
        - name: "subscriptions"
          url: "/subscriptions/"
          weight: 36
        - name: "tags"
          url: "/tags/"
          weight: 40
        - name: "archive"
          url: "/archive/"
          weight: 50

  zh:
    locale: "zh-CN"
    label: "中文"
    weight: 2
    title: "Brian Pfeil"
    params:
      homeTitle: "Brian Pfeil"
    # The zh site has no posts of its own, so the JSON search index and the
    # llms.txt/RSS feeds would render empty. Point them at the English ones
    # instead by only emitting HTML here.
    outputs:
      home:
        - html
    menus:
      main:
        - name: "关于"
          url: "/zh/about/"
          weight: 10
        - name: "文章"
          url: "/zh/"
          weight: 20
        - name: "项目"
          url: "/zh/projects/"
          weight: 30
        - name: "音乐"
          url: "/zh/music/"
          weight: 35
        - name: "订阅"
          url: "/zh/subscriptions/"
          weight: 36
        # Tags are generated from the English posts, so this points at the
        # English taxonomy rather than an empty /zh/tags/.
        - name: "标签"
          url: "/tags/"
          weight: 40
        - name: "归档"
          url: "/zh/archive/"
          weight: 50
