baseURL: "https://brianpfeil.com/"
disablePathToLower: true
enableRobotsTXT: true
title: "Brian Pfeil"

# Multilingual. English is the source language and stays at the site root so
# every existing URL is unchanged; Mandarin lives under /zh/. Posts are written
# in English only -- the zh site translates the chrome and the standalone pages
# and lists the English posts (see partials/site-posts.html).
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

buildFuture: true
# Lastmod from git: accurate sitemap dates, and the "Updated" line on the
# architecture guides. The deploy checks out full history for this.
enableGitInfo: true
pagination:
  pagerSize: 30

googleAnalytics: "G-SKVHNJ985Y"

# Hugo 0.162.0 added security.allowContent, which denies the text/html content
# format by default to prevent arbitrary JS in content files. content/steps/*.html
# are hand-authored standalone HTML pages, so the default breaks the build.
# Single-author repo, so restore the pre-0.162 behavior.
# The nav avatar is shown at 36px but the file in static/ is 320px; mounting it
# into assets lets partials/nav.html resize it at build time, so it can never
# drift from the original. Declaring an assets mount replaces the default one,
# hence assets/ itself is listed too.
module:
  mounts:
    - source: assets
      target: assets
    - source: static/images/2025-03-01-profile-brian-pfeil-avatar.jpg
      target: assets/images/avatar.jpg

security:
  allowContent:
    - ".*"

related:
  includeNewer: true
  threshold: 30
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 40
    - name: date
      weight: 10

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false
  highlight:
    style: trac
    lineNos: false
    noClasses: false

params:
  # Search Console / Bing Webmaster ownership codes (the content="" part of
  # their meta tag). Empty renders nothing. Waiting on B: see CLAUDE.md,
  # "Waiting on B".
  verification:
    google: ""
    bing: ""
    yandex: ""
  homeTitle: "Brian Pfeil"
  mainSections: ["post", "posts"]
  dateFormat: "January 2, 2006"
  rss: true
  rssLimit: 500
  # Newsletter sign-up (partials/newsletter.html). Set to the Buttondown
  # username to show the form; empty hides it everywhere.
  newsletter:
    buttondown: "pfeilbr"
  author:
    name: "Brian Pfeil"
    website: "https://brianpfeil.com"
    github: "pfeilbr"
    twitter: "pfeilbr"
    stackoverflow: "users/29148/pfeilbr"
    youtube: "@pfeilbr"
    pinterest: "pfeilbr"
    snapchat: "pfeilbr"
    # TikTok username (the URL part). B renamed it from TikTok's generated
    # user8768514322831 on 2026-10-07; tools/profiles/tiktok_handle.py (daily
    # Action) confirms @pfeilbr is still the same account.
    tiktok: "pfeilbr"
    # Handle only. A Discord profile URL needs the numeric user id, not the
    # @handle, so the footer offers this to copy rather than linking to it.
    discord: "pfeilbr"
    # WeChat ID. WeChat has no public profile URL either, so it is offered to
    # copy (footer, home hero, /about/) like Discord.
    wechat: "methym00"
    # Phone, published on purpose (B, 2026-10-08). Shown as written; the tel:
    # link and the JSON-LD telephone strip the spaces and dashes.
    phone: "+1 215-872-2791"

mediaTypes:
  text/plain:
    suffixes:
      - txt

outputFormats:
  llmstxt:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
  # Everything, for tools that want the whole site in one file; llms.txt is
  # the short index that points at it.
  llmsfull:
    mediaType: text/plain
    baseName: llms-full
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - html
    - rss
    - json
    - llmstxt
    - llmsfull

languages:
  en:
    locale: "en-us"
    label: "English"
    weight: 1
    title: "Brian Pfeil"
    params:
      homeTitle: "Brian Pfeil"
    menus:
      main:
        - name: "guides"
          url: "/architecture/"
          weight: 10
        - name: "courses"
          url: "/courses/"
          weight: 20
        - name: "learn"
          url: "/learn/"
          weight: 30
        - name: "articles"
          url: "/post/"
          weight: 40
        - name: "projects"
          url: "/projects/"
          weight: 50
        - name: "about"
          url: "/about/"
          weight: 60

  zh:
    locale: "zh-CN"
    label: "中文"
    weight: 2
    title: "Brian Pfeil"
    params:
      homeTitle: "Brian Pfeil"
    # The zh site has no posts of its own, so the JSON search index and the
