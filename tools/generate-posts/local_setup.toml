# What in a README only works on, or names, B's own machine and accounts.
# One list, read by the post generator (localsetup.go, every lab note) and
# by the GitHub page refresher (tools/github-repos/refresh.py, the README
# excerpts on /github/). The site structure check fails if any key of
# [replace] or any account survives into the built site.
#
# `make notes-strip` re-applies it to the lab notes in place;
# `make github-refresh` picks it up for /github/.

# AWS CLI profiles that exist only in B's ~/.aws/config: the flag is removed
# and `export AWS_PROFILE=` lines are dropped. Profiles that are part of a
# demo (partner-01 in s3-access-points, my-lambda-role in aws-sam-golang)
# are deliberately not here.
profiles = ["root-AWSAdministratorAccess", "hub01-admin", "admin", "automation-user"]

# B's own AWS account (personal, hub01), shown as AWS's documented example
# account 123456789012 instead. Only B's: README examples also name
# AWS-owned accounts (Ground Truth, Serverless Inc) that must stay.
accounts = ["529276214230"]

home_dirs = ["/Users/pfeilbr", "/Users/brianpfeil"]

# `cd ~/projects` and friends: just "go to where I keep checkouts".
workspace_dirs = ["projects", "dev", "tmp"]

# Lines that only say where something lives on B's machine.
drop_lines = [
  '(?i)^\s*[-*]\s+in vs ?code,? select .*kernel',
  '(?i)^>?\s*Root V8 source directory is @ .* on local machine',
  '(?i)^\s*spark installed at ',
  # pointers to B's private notes
  '(?i)^\s*[-*]\s+see .*~/Dropbox/',
]

# Exact strings, rewritten longest first.
[replace]
"/Users/pfeilbr/Dropbox/Alfred/Alfred.alfredpreferences" = "/path/to/Alfred.alfredpreferences"
"~/dev/spark-2.2.0-bin-hadoop2.7" = "/path/to/spark-2.2.0-bin-hadoop2.7"
"~/dev/emsdk" = "/path/to/emsdk"
# B's S3 buckets, as AWS's documented example bucket names
"com.brianpfeil.s3-website-playground.site01" = "amzn-s3-demo-website-bucket"
"com.brianpfeil.cloudfront.logs" = "amzn-s3-demo-logging-bucket"
"com.brianpfeil.scratch01" = "amzn-s3-demo-bucket"
"com.brianpfeil.scratch" = "amzn-s3-demo-bucket"
"pfeil-static-site-01" = "amzn-s3-demo-static-site"
# B's Azure resources, as Microsoft's documentation names them
"brianpfeilgmail.onmicrosoft.com" = "contoso.onmicrosoft.com"
"dev.azure.com/brianpfeil/" = "dev.azure.com/contoso/"
"brianpfeilmystorage01" = "mystorageaccount01"
"brianpfeilmyfn01" = "myfunctionapp01"
"pfeilbr-aks-01" = "my-aks-01"
