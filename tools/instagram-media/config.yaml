# Where the built media lives. The bucket is private; CloudFront (OAC) is the
# only thing that can read it, which is why base_url is the distribution and
# not an S3 URL.
bucket: "brianpfeil-media01"
s3_prefix: "instagram"
base_url: "https://dfalwjniugna7.cloudfront.net"
# Needed so --prune can evict deleted files from the CDN cache; every file
# is cached for a year, so deleting from S3 alone leaves it being served.
# Matches `terraform output media_distribution_id` in infra/.
distribution_id: "E2U0TCXARHWOEF"

# Paths. work_dir and lock_file are relative to this tool; data_file is
# relative to the repo root.
work_dir: "build"
manifest: "manifest.yaml"
lock_file: "derivatives.lock.json"
data_file: "data/media.yaml"

# The default media source: the instagram-archive project, which keeps every
# feed post and reel as metadata.json + media/. --export overrides it.
archive_dir: "~/projects/instagram/archive"

# Stories read off the iOS app, with which ones were reshares. A story that
# reshares someone else's post, or one of the reels already on the page, is
# published with a "reshared" label. Missing file = no labels.
story_inventory: "~/projects/instagram/harvest/iphone/story-inventory.jsonl"

# Google Photos, chosen by hand in the picker (make media-picker). Candidates
# come from Google Photos searches: "<person> <query>" finds shots Google
# matched to B's face, and "<query>" alone finds scenes, which are only
# offered when nobody at all is in them. See igmedia/screen.py for the rules.
# Order here is the order of the sections and the nav on /media/; each key
# needs media_cat_<key> in all nine i18n files.
gphotos:
  person: "Brian Pfeil"
  # Named face groups in Google Photos who must never appear. Everything
  # Google matches to them in a category's search is blocked.
  exclude_people: ["Wyatt Pfeil", "Max"]
  picks: "picks.yaml"
  lock_file: "photos.lock.json"
  s3_prefix: "photos"
  data_file: "data/photos.yaml"
  categories:
    - {key: skiing, query: "skiing"}
    - {key: mountain-biking, query: "mountain biking"}
    - {key: kayaking, query: "kayaking"}
    - {key: swimming, query: "swimming"}
    - {key: beach, query: "beach"}
    - {key: hiking, query: "hiking"}
