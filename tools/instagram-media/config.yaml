# Where the built media lives. The bucket is private; CloudFront (OAC) is the
# only thing that can read it, which is why base_url is the distribution and
# not an S3 URL.
bucket: "brianpfeil-media01"
s3_prefix: "instagram"
base_url: "https://dfalwjniugna7.cloudfront.net"
# Needed so --prune can evict deleted files from the CDN cache; every file
# is cached for a year, so deleting from S3 alone leaves it being served.
# Matches `terraform output media_distribution_id` in infra/.
distribution_id: "E2U0TCXARHWOEF"

# Paths. work_dir and lock_file are relative to this tool; data_file is
# relative to the repo root.
work_dir: "build"
manifest: "manifest.yaml"
lock_file: "derivatives.lock.json"
data_file: "data/media.yaml"

# The default media source: the instagram-archive project, which keeps every
# feed post and reel as metadata.json + media/. --export overrides it.
archive_dir: "~/projects/instagram/archive"
